<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axelion Launcher | En mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070b;
    --text: #f2f3f7;
    --muted: #8b8d9c;
    --neon: #00e5ff;
    --neon2: #b44cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Toque neón en el fondo */
  body::before {
    content: "";
    position: fixed;
    left: 50%; bottom: -38vh;
    width: 120vmax; height: 70vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
      rgba(0, 229, 255, .30) 0%,
      rgba(180, 76, 255, .18) 38%,
      transparent 70%);
    filter: blur(50px);
    animation: breathe 7s ease-in-out infinite;
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), var(--neon2), transparent);
    box-shadow: 0 0 22px var(--neon), 0 0 60px rgba(180, 76, 255, .6);
    opacity: .9;
  }
  @keyframes breathe {
    50% { opacity: .6; transform: translateX(-50%) scale(1.06); }
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 520px;
  }

  /* Símbolo giratorio minimalista */
  .spinner {
    width: 44px; height: 44px;
    margin: 0 auto 2.2rem;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .10);
    border-top-color: var(--neon);
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.3;
    margin-bottom: .9rem;
  }
  p {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.65;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 30s !important; }
  }
</style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Estamos trabajando en Axelion Launcher</h1>
    <p>Estamos realizando tareas de mantenimiento.<br>Por favor, vuelve más tarde.</p>
  </main>
</body>
</html>
