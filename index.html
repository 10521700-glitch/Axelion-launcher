<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXELION</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.2.0/bundles/skinview3d.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Instrument Sans',sans-serif;background:#060608;color:#fff;overflow:hidden;width:100vw;height:100vh}
.bg{position:fixed;inset:0;background:#060608;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);background-size:50px 50px;mask-image:radial-gradient(900px at 50% 50%, black, transparent);animation:gridMove 20s linear infinite}
@keyframes gridMove{0%{transform:translate(0,0)}100%{transform:translate(50px,50px)}}
.orb{position:absolute;border-radius:50%;filter:blur(100px);mix-blend-mode:screen;opacity:.9}
.orb1{width:800px;height:800px;background:radial-gradient(circle, rgba(120,119,255,1), rgba(120,119,255,0) 70%);top:-250px;left:-250px;animation:orbFloat1 12s infinite alternate ease-in-out}
.orb2{width:700px;height:700px;background:radial-gradient(circle, rgba(56,189,248,0.8), rgba(56,189,248,0) 70%);bottom:-200px;right:-150px;animation:orbFloat2 14s infinite alternate ease-in-out}
.orb3{width:500px;height:500px;background:radial-gradient(circle, rgba(168,85,247,0.6), transparent 70%);top:50%;left:50%;animation:orbFloat3 18s infinite alternate}
@keyframes orbFloat1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,60px) scale(1.2)}}
@keyframes orbFloat2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-70px,-50px) scale(1.3)}}
@keyframes orbFloat3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-40%,-60%) scale(1.4)}}
.card{position:relative;background:rgba(16,16,20,0.6);backdrop-filter:blur(50px) saturate(1.8);-webkit-backdrop-filter:blur(50px);border:1px solid rgba(255,255,255,0.08);border-radius:28px;box-shadow:0 20px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);animation:cardIn 0.8s ease-out, cardFloat 6s infinite ease-in-out}
@keyframes cardIn{0%{opacity:0;transform:translateY(30px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card:hover{box-shadow:0 30px 100px rgba(0,0,0,0.8), 0 0 40px rgba(120,119,255,0.15), inset 0 1px 0 rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.12);transition:0.4s}
.btn{position:relative;width:100%;background:linear-gradient(135deg,#fff,#e0e0ff);color:#000;font-weight:800;border-radius:16px;padding:14px;border:none;cursor:pointer;overflow:hidden;transition:0.3s;animation:btnPulse 2s infinite}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}50%,100%{left:100%}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.2)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 30px rgba(255,255,255,0.3)}
.btn:active{transform:scale(0.98)}
.btn-ghost{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);transition:0.3s}
.btn-ghost:hover{background:rgba(255,255,255,0.1);border-color:rgba(120,119,255,0.3);transform:translateY(-1px);box-shadow:0 0 20px rgba(120,119,255,0.2)}
.input{width:100%;background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;color:#fff;outline:none;transition:0.3s}
.input:focus{border-color:rgba(120,119,255,0.5);box-shadow:0 0 0 4px rgba(120,119,255,0.15), 0 0 20px rgba(120,119,255,0.2);transform:scale(1.01);background:rgba(255,255,255,0.08)}
.input:hover{border-color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.06)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.5);backdrop-filter:blur(40px);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn 0.5s ease-out}
@keyframes overlayIn{0%{opacity:0;backdrop-filter:blur(0)}100%{opacity:1;backdrop-filter:blur(40px)}}
.progress{height:5px;background:rgba(255,255,255,0.08);border-radius:100px;overflow:hidden;position:relative}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#7877FF,#38BDF8,#a855f7);background-size:200% 100%;box-shadow:0 0 20px rgba(120,119,255,0.6);transition:width 0.8s ease-out;animation:barGradient 2s infinite linear}
@keyframes barGradient{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.spin{animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.label{font-size:10px;letter-spacing:1.2px;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:8px;display:block;font-weight:700;animation:labelGlow 3s infinite}
@keyframes labelGlow{0%,100%{color:rgba(255,255,255,0.5)}50%{color:rgba(120,119,255,0.8)}}
.shake{animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.title-glow{animation:titleGlow 4s infinite alternate}
@keyframes titleGlow{0%{text-shadow:0 0 10px rgba(120,119,255,0.3)}100%{text-shadow:0 0 30px rgba(120,119,255,0.6), 0 0 60px rgba(56,189,248,0.3)}}
.skin-glow{animation:skinGlow 5s infinite alternate}
@keyframes skinGlow{0%{box-shadow:0 0 20px rgba(120,119,255,0.1)}100%{box-shadow:0 0 50px rgba(120,119,255,0.3), 0 0 80px rgba(56,189,248,0.15)}}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ram-glow{transition:0.3s}
.ram-glow:hover{box-shadow:0 0 20px rgba(120,119,255,0.4)}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div id="updateOverlay" class="overlay">
  <div class="card" style="width:100%;max-width:420px;padding:32px">
    <div id="updateState1">
      <div class="bounce" style="width:64px;height:64px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#fff,#c0c0ff);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(120,119,255,0.4)"><div style="width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#7877FF,#38BDF8);animation:spin 3s linear infinite"></div></div>
      <h2 class="title-glow" style="text-align:center;font-size:19px;font-weight:800">Actualización disponible</h2>
      <p style="text-align:center;font-size:12px;color:rgba(255,255,255,0.5);margin-top:6px;animation:labelGlow 2s infinite">Nueva versión con mejoras épicas</p>
      <div style="margin:24px 0;padding:16px;background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);border-radius:18px;animation:cardFloat 5s infinite">
        <p style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:8px;letter-spacing:1px;font-weight:700">NOVEDADES ✨</p>
        <p style="font-size:12px;color:rgba(255,255,255,0.7);line-height:2">• Inicio 3x más rápido 🚀<br>• Seguridad mejorada 🔒<br>• Interfaz renovada ✨<br>• Optimización extrema ⚡</p>
      </div>
      <button id="btnUpdate" class="btn">Actualizar ahora</button>
    </div>
    <div id="updateState2" style="display:none;text-align:center">
      <div style="width:60px;height:60px;margin:0 auto 16px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center"><div style="width:26px;height:26px;border:3px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%" class="spin"></div></div>
      <h2 style="font-size:16px;font-weight:800">Instalando...</h2>
      <p style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px"><span id="timeLeft">1:00</span></p>
      <div class="progress" style="margin:20px 0 8px"><div id="pBar2" class="bar"></div></div>
      <p id="pText2" style="font-size:10px;color:rgba(255,255,255,0.4)">Preparando...</p>
    </div>
    <div id="updateState3" style="display:none;text-align:center">
      <div class="bounce" style="width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:#22C55E;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 30px rgba(34,197,94,0.5)">✓</div>
      <h2 class="title-glow" style="font-size:18px;font-weight:800">¡Completado!</h2>
      <button id="btnContinue" class="btn" style="margin-top:20px">Continuar</button>
    </div>
  </div>
</div>

<div id="lockOverlay" class="overlay" style="display:none">
  <div id="lockCard" class="card" style="width:100%;max-width:360px;padding:28px">
    <h2 id="lockTitle" class="title-glow" style="font-size:16px;font-weight:800;text-align:center">AXELION</h2>
    <p id="lockSub" style="font-size:11px;color:rgba(255,255,255,0.4);text-align:center;margin:6px 0 18px"></p>
    <input id="lockInput" type="password" class="input" placeholder="Contraseña">
    <button id="lockBtn" class="btn" style="margin-top:12px">Continuar</button>
    <p id="lockError" style="font-size:11px;color:#ef4444;margin-top:8px;display:none;text-align:center"></p>
  </div>
</div>

<div id="loadingOverlay" class="overlay" style="display:none">
  <div class="card" style="width:100%;max-width:360px;padding:28px;text-align:center">
    <div style="width:48px;height:48px;margin:0 auto 12px;border-radius:14px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center"><div style="width:22px;height:22px;border:3px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%" class="spin"></div></div>
    <p id="loadingClient" style="font-size:12px;color:rgba(255,255,255,0.6)"></p>
    <div class="progress" style="margin:14px 0"><div id="loadingBar" class="bar"></div></div>
  </div>
</div>

<div id="app" style="display:none;position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:100%;max-width:980px;padding:20px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:16px">
    <style>@media(max-width:800px){#app .card{grid-template-columns:1fr!important;overflow:auto;max-height:95vh}}</style>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><p class="title-glow" style="font-weight:800;font-size:13px;letter-spacing:1px">AXELION</p><div style="display:flex;gap:6px"><span id="headerUser" style="font-size:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:5px 10px;border-radius:100px;animation:labelGlow 3s infinite"></span><button id="btnLogout" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:5px 10px;color:rgba(255,255,255,0.5);font-size:10px;cursor:pointer;transition:0.3s">Salir</button></div></div>
      <div style="padding:14px;background:rgba(255,255,255,0.03);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.06);border-radius:20px;transition:0.4s" onmouseover="this.style.transform='scale(1.01)';this.style.borderColor='rgba(120,119,255,0.2)'" onmouseout="this.style.transform='scale(1)';this.style.borderColor='rgba(255,255,255,0.06)'">
        <p class="label">Clientes</p>
        <select id="client" class="input" style="margin-top:6px"><option>Vanilla 26.2</option><option>Pixel client 1.8.8</option><option>Modern client 1.12.2</option><option>EB Client 1.8.9</option><option>Resent Client 1.8.9</option></select>
        <div style="margin-top:12px"><label class="label">RAM</label><div style="display:flex;gap:10px;align-items:center"><input id="ram" type="range" min="2" max="16" value="4" style="flex:1;accent-color:#7877FF" class="ram-glow"><span id="ramVal" style="font-size:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:5px 10px;border-radius:100px;animation:labelGlow 3s infinite">4 GB</span></div></div>
      </div>
      <input id="username" class="input" placeholder="Tu nick ✨" style="margin-top:12px">
      <div style="margin-top:12px;padding:14px;background:rgba(255,255,255,0.03);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.06);border-radius:20px;transition:0.3s"><p class="label">Cuenta</p><div id="accountLogged" style="display:none"><p style="font-size:12px">Conectado como <b id="accName"></b> 🔥</p><button id="accLogout" style="margin-top:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:5px 10px;color:rgba(255,255,255,0.5);font-size:10px;cursor:pointer">Cambiar</button></div><div id="accountForm"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="accUser" class="input" placeholder="Nombre"><input id="accPass" type="password" class="input" placeholder="Contraseña"></div><div style="display:flex;gap:8px;margin-top:8px"><button id="btnAccRegister" class="btn" style="flex:1;padding:12px;font-size:11px">Crear</button><button id="btnAccLogin" class="btn btn-ghost" style="flex:1;padding:12px;font-size:11px">Entrar</button></div><p id="accError" style="font-size:10px;color:#ef4444;margin-top:6px;display:none"></p></div></div>
      <button id="launch" class="btn" style="margin-top:12px;padding:16px;font-size:14px;letter-spacing:0.5px">▶ INICIAR 🚀</button>
    </div>
    <div><div class="skin-glow" style="background:rgba(255,255,255,0.03);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:10px;transition:0.4s"><canvas id="skinViewer" width="320" height="340" style="width:100%;height:340px;border-radius:16px;background:radial-gradient(300px at 50% 0%, rgba(120,119,255,0.15), transparent 70%)"></canvas><div style="display:flex;gap:6px;margin-top:8px"><button id="bSteve" class="btn btn-ghost" style="flex:1;padding:10px;font-size:11px">Steve</button><button id="bAlex" class="btn btn-ghost" style="flex:1;padding:10px;font-size:11px">Alex</button><label class="btn btn-ghost" style="flex:1;padding:10px;font-size:11px;text-align:center;cursor:pointer"><input id="skinFile" type="file" accept=".png" style="display:none">Subir</label></div></div></div>
  </div>
</div>

<script>
var LS_DONE="axelion_done_final", LS_LOCK="axelion_lock", LS_USERS="axelion_acc", LS_SESS="axelion_sess", LS_DATA="axelion_data";
var state={username:"",skin:"https://crafatar.com/skins/8667ba78-b993-4f93-beef-eb74e4cd3b5a",model:"default",ram:4,client:"Vanilla 1.20.1"};
var currentAcc=null;

const CLIENT_LINKS = {
  "Vanilla 26.2": "https://eaglercraft-26-2-u1-cdn.u2471966200.workers.dev/eaglercraft-26.2-u2.html?v=u2-20261020",
  "Pixel client 1.8.8": "https://pixellauncher.onrender.com/",
  "Modern client 1.12.2": "https://wasm.modernclient.online/",
  "EB Client 1.8.9": "https://launcher.eb-bridging.pro/play/LITECU7/",
  "Resent Client 1.8.9": "https://elite4r.github.io/Resent-Client/game.html"
};

function initUpdate(){ if(localStorage.getItem(LS_DONE)==="true"){ document.getElementById('updateOverlay').style.display='none'; initLock(); return; } document.getElementById('updateOverlay').style.display='flex'; }
document.getElementById('btnUpdate').onclick=function(){
  document.getElementById('updateState1').style.display='none'; document.getElementById('updateState2').style.display='block';
  var bar=document.getElementById('pBar2'), txt=document.getElementById('pText2'), perc=document.getElementById('pPercent2'), tl=document.getElementById('timeLeft');
  var total=60, el=0; var steps=["Preparando archivos...","Descargando componentes...","Verificando integridad...","Instalando actualización...","Finalizando..."];
  var inter=setInterval(function(){ el++; var p=Math.min(100,(el/total)*100); bar.style.width=p+"%"; perc.textContent=Math.floor(p)+"%"; txt.textContent=steps[Math.min(steps.length-1,Math.floor((p/100)*steps.length))]; var r=total-el; tl.textContent="0:"+(r<10?"0"+r:r); if(el>=total){ clearInterval(inter); localStorage.setItem(LS_DONE,"true"); document.getElementById('updateState2').style.display='none'; document.getElementById('updateState3').style.display='block'; } },1000);
};
document.getElementById('btnContinue').onclick=function(){ document.getElementById('updateOverlay').style.display='none'; initLock(); };
function initLock(){ var s=localStorage.getItem(LS_LOCK); document.getElementById('lockOverlay').style.display='flex'; if(!s){ document.getElementById('lockTitle').textContent="AXELION"; document.getElementById('lockSub').textContent="Crea tu clave de acceso"; document.getElementById('lockBtn').textContent="Crear clave"; } else { document.getElementById('lockTitle').textContent="Bienvenido"; document.getElementById('lockSub').textContent="Ingresa tu clave"; document.getElementById('lockBtn').textContent="Entrar"; } }
document.getElementById('lockBtn').onclick=function(){ var v=document.getElementById('lockInput').value.trim(), s=localStorage.getItem(LS_LOCK), e=document.getElementById('lockError'), c=document.getElementById('lockCard'); if(v.length<3){ e.style.display='block'; e.textContent='Mínimo 3 caracteres'; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; } if(!s){ localStorage.setItem(LS_LOCK,v); document.getElementById('lockOverlay').style.display='none'; initApp(); } else { if(v===s){ document.getElementById('lockOverlay').style.display='none'; initApp(); } else { e.style.display='block'; e.textContent='Clave incorrecta'; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } } };
document.getElementById('btnLogout').onclick=function(){ document.getElementById('lockInput').value=''; document.getElementById('app').style.display='none'; initLock(); };
function getUsers(){ try{return JSON.parse(localStorage.getItem(LS_USERS)||"[]")}catch(e){return[]} } function saveUsers(u){ localStorage.setItem(LS_USERS, JSON.stringify(u)); }
function initApp(){ document.getElementById('app').style.display='flex'; loadData(); var sess=localStorage.getItem(LS_SESS); var users=getUsers(); if(sess){ var f=users.find(function(x){return x.name===sess}); if(f){ currentAcc=f; showLogged(); } } }
function showLogged(){ document.getElementById('accountForm').style.display='none'; document.getElementById('accountLogged').style.display='block'; document.getElementById('accName').textContent=currentAcc.name; document.getElementById('headerUser').textContent='@'+currentAcc.name; }
function showForm(){ document.getElementById('accountForm').style.display='block'; document.getElementById('accountLogged').style.display='none'; }
document.getElementById('btnAccRegister').onclick=function(){ var n=document.getElementById('accUser').value.trim(), p=document.getElementById('accPass').value.trim(), er=document.getElementById('accError'); if(n.length<3||p.length<3){ er.style.display='block'; er.textContent='Mínimo 3 caracteres'; return; } var us=getUsers(); if(us.find(function(u){return u.name.toLowerCase()===n.toLowerCase()})){ er.style.display='block'; er.textContent='Nombre ya existe'; return; } var nu={name:n,pass:p}; us.push(nu); saveUsers(us); localStorage.setItem(LS_SESS,n); currentAcc=nu; showLogged(); saveData(); };
document.getElementById('btnAccLogin').onclick=function(){ var n=document.getElementById('accUser').value.trim(), p=document.getElementById('accPass').value.trim(), er=document.getElementById('accError'); var u=getUsers().find(function(x){return x.name.toLowerCase()===n.toLowerCase() && x.pass===p}); if(!u){ er.style.display='block'; er.textContent='Datos incorrectos'; return; } currentAcc=u; localStorage.setItem(LS_SESS,u.name); showLogged(); saveData(); };
document.getElementById('accLogout').onclick=function(){ localStorage.removeItem(LS_SESS); currentAcc=null; showForm(); document.getElementById('headerUser').textContent=''; };
function saveData(){ try{ var k=LS_DATA+"_"+(currentAcc?currentAcc.name:"default"); localStorage.setItem(k, JSON.stringify(state)); }catch(e){} }
function loadData(){ try{ var k=LS_DATA+"_"+(currentAcc?currentAcc.name:"default"); var raw=localStorage.getItem(k); if(!raw) raw=localStorage.getItem(LS_DATA+"_default"); if(raw){ var o=JSON.parse(raw); for(var kk in o) state[kk]=o[kk]; } document.getElementById('username').value=state.username|| (currentAcc?currentAcc.name:""); document.getElementById('ram').value=state.ram||4; document.getElementById('ramVal').textContent=(state.ram||4)+" GB"; document.getElementById('client').value=state.client||"Vanilla 1.20.1"; }catch(e){} }
var viewer; function initViewer(){ try{ var c=document.getElementById('skinViewer'); viewer=new skinview3d.SkinViewer({canvas:c,width:320,height:340}); viewer.animation=new skinview3d.WalkingAnimation(); viewer.animation.speed=0.6; viewer.controls.enableZoom=false; viewer.renderer.setClearColor(0x000000,0); }catch(e){} }
function setSkin(url,model){ try{ if(viewer){ viewer.loadSkin(url).then(function(){ if(model) viewer.playerObject.skin.modelType=model; }); } state.skin=url; if(model) state.model=model; saveData(); }catch(e){} }
document.addEventListener('DOMContentLoaded', function(){
  initViewer(); initUpdate();
  document.getElementById('username').addEventListener('input', function(e){ state.username=e.target.value; saveData(); });
  document.getElementById('client').addEventListener('change', function(e){ state.client=e.target.value; saveData(); });
  document.getElementById('ram').addEventListener('input', function(e){ state.ram=e.target.value; document.getElementById('ramVal').textContent=e.target.value+" GB"; saveData(); });
  document.getElementById('bSteve').onclick=function(){ setSkin('https://crafatar.com/skins/8667ba78-b993-4f93-beef-eb74e4cd3b5a','default'); };
  document.getElementById('bAlex').onclick=function(){ setSkin('https://crafatar.com/skins/4566e69f-cfbe-40d1-bf24-3c488b0d2a8','slim'); };
  document.getElementById('skinFile').addEventListener('change', function(e){ var f=e.target.files[0]; if(!f) return; var url=URL.createObjectURL(f); setSkin(url,'default'); });
  document.getElementById('launch').onclick=function(){
    var selectedClient = document.getElementById('client').value;
    var link = CLIENT_LINKS[selectedClient];
    if(!link){ alert("Pon el link para " + selectedClient); return; }
    document.getElementById('loadingClient').textContent=selectedClient;
    document.getElementById('loadingOverlay').style.display='flex';
    var bar=document.getElementById('loadingBar');
    var p=0, inter=setInterval(function(){
      p+=Math.random()*20+10; if(p>100)p=100; bar.style.width=p+"%";
      if(p>=100){
        clearInterval(inter);
        setTimeout(function(){
          document.getElementById('loadingOverlay').style.display='none';
          var w = 1100, h = 750;
          var left = (screen.width/2)-(w/2);
          var top = (screen.height/2)-(h/2);
          var popup = window.open(link, selectedClient, `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`);
          if(!popup){ alert("Activa ventanas emergentes"); }
        }, 600);
      }
    }, 250);
  };
});
</script>
</body>
</html>
